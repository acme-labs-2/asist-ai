<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACME Labs · Assis-AI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <section class="panel">
            <div class="panel-inner">
                <div style="
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    padding-bottom: 12px;
                    margin-bottom: 15px;
                    border-bottom: 2px solid rgba(160, 68, 255, 0.2);
                ">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <span style="font-size: 22px;">🤖</span>
                        <div>
                            <span style="font-size: 18px; font-weight: bold; color: var(--violet-soft);">asistAI</span>
                            <span style="font-size: 11px; color: #4a5270; background: rgba(79,70,229,0.15); padding: 2px 10px; border-radius: 10px; margin-left: 8px;">v2.0</span>
                        </div>
                    </div>
                </div>
                <!-- ===== FIN TÍTULO ===== -->

                <div class="console" id="consoleOutput">
                    <span id="typewriter"></span><span class="cursor" id="cursor"></span>
                </div>
                <div class="search-container" id="searchContainer">
                    <label for="dniInput">📌 Ingresa un DNI, el nombre de una entidad o descargas</label>
                    <div class="input-row">
                        <input type="text" id="dniInput" placeholder="Ej: 34340714 o Creditia" maxlength="50" onkeydown="if(event.key==='Enter') buscarDNI()">
                        <div class="button-group">
                            <button onclick="buscarDNI()">🔍 CONSULTAR</button>
                            <button class="btn-copiar-busqueda" id="btnCopiar" onclick="copiarResultado()">
                                📋 COPIAR
                            </button>
                        </div>
                    </div>
                </div>
                <div class="result" id="resultContent">
                    <div id="resultText" class="result-moderno"></div>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
